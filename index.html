<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکنینی هەژمار</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: #121929;
            --primary-blue: #00d2ff;
            --secondary-blue: #3a7bd5;
            --neon-glow: rgba(0, 210, 255, 0.4);
            --text-color: #ffffff;
            --text-secondary: #a0aec0;
            --danger-red: #ff4757;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--neon-glow);
            position: relative;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-blue);
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0d1322;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--secondary-blue), var(--primary-blue));
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--neon-glow);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-show {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            display: none;
            margin-top: 15px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-blue);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 25px var(--neon-glow);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--danger-red);
            font-size: 20px;
            cursor: pointer;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .input-with-copy {
            display: flex;
            gap: 8px;
        }

        .field-input {
            flex: 1;
        }

        .copy-btn {
            padding: 0 15px;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--primary-blue);
            color: #000;
        }

        #loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--primary-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>پشکنینی هەژمار</h2>
        
        <div class="form-group">
            <label for="accountNumber">ژمارەی هەژمار (Account ID):</label>
            <input type="text" id="accountNumber" placeholder="ژمارەی هەژمار بنووسە...">
        </div>

        <button class="btn" onclick="fetchData()">گەڕان 🔍</button>

        <div id="loader">چاوەڕێ بکە... ⏳</div>

        <!-- دوگمەی نیشاندانی زانیارییە شاراوەکان -->
        <button id="showModalBtn" class="btn btn-show" onclick="toggleModal(true)">
            👁️ پێشان دانی زانیارییە شاراوەکان (روز / ژمارە)
        </button>
    </div>

    <!-- مۆداڵی زانیارییە شاراوەکان -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">🔐 زانیارییە شاراوەکان</h3>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>

            <!-- ڕۆژی لەدایکبوون -->
            <div class="field-group">
                <label class="field-label" id="lblBday">ڕۆژی لەدایکبوون (Birthday)</label>
                <div class="input-with-copy">
                    <input type="text" id="bdayInput" class="field-input" value="" readonly>
                    <button class="copy-btn btn-copy-text" onclick="copyText('bdayInput')">کۆپی</button>
                </div>
            </div>

            <!-- ژمارەی تەلەفۆن -->
            <div class="field-group">
                <label class="field-label" id="lblPhone">ژمارەی تەلەفۆن (Phone)</label>
                <div class="input-with-copy">
                    <input type="text" id="phoneInput" class="field-input" value="" readonly>
                    <button class="copy-btn btn-copy-text" onclick="copyText('phoneInput')">کۆپی</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // لێرەدا لینکە سەرەکیەکەی Google Apps Script دابنێ
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        let fetchedData = null;

        function fetchData() {
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const loader = document.getElementById('loader');
            const showModalBtn = document.getElementById('showModalBtn');

            if (!accountNumber) {
                alert('تکایە ژمارەی هەژمار بنووسە!');
                return;
            }

            loader.style.display = 'block';
            showModalBtn.style.display = 'none';

            fetch(`${scriptURL}?account=${accountNumber}`)
                .then(response => response.json())
                .then(res => {
                    loader.style.display = 'none';
                    fetchedData = res;

                    if (fetchedData && fetchedData.status === 'success' && fetchedData.data) {
                        // تێکردنی زانیارییەکان بۆ ناو خشتە شاراوەکان
                        document.getElementById('bdayInput').value = fetchedData.data.birthday || 'نەدۆزرایەوە';
                        document.getElementById('phoneInput').value = fetchedData.data.phone || 'نەدۆزرایەوە';
                        
                        // نیشاندانی دوگمەی نیشاندانی مۆداڵ
                        showModalBtn.style.display = 'block';
                    } else {
                        alert('هیچ زانیارییەک بۆ ئەم ژمارەیە نەدۆزرایەوە!');
                    }
                })
                .catch(error => {
                    loader.style.display = 'none';
                    console.error('Error:', error);
                    alert('هەڵەیەک ڕوویدا لە کاتی هێنانی زانیارییەکان!');
                });
        }

        function toggleModal(show) {
            const modal = document.getElementById('infoModal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function copyText(inputId) {
            const input = document.getElementById(inputId);
            if (input.value && input.value !== 'نەدۆزرایەوە') {
                navigator.clipboard.writeText(input.value).then(() => {
                    alert('کۆپی کرا!');
                });
            }
        }
    </script>
</body>
</html>
