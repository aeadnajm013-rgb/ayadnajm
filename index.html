<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MamostaHemnIT - Account Info</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Kufi Arabic', 'Poppins', sans-serif;
        }
        
        body {
            background: #030712;
            background: radial-gradient(circle at top, #0f172a 0%, #030712 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            overflow: hidden;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        /* بەشی سەرەوە: هەڵبژاردنی زمان */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .lang-selector {
            display: flex;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 20px;
            padding: 3px;
            gap: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 0 10px #2563eb;
        }

        /* دوگمەی واتساپ */
        .whatsapp-banner {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
            border: 1px solid #34d399;
            transition: all 0.3s ease;
        }
        .whatsapp-banner:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
        }
        .whatsapp-banner svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* LED ی شین و سوور */
        .db-logo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin-bottom: 15px;
            position: relative;
            cursor: pointer;
            animation: ledPulseBlueRed 2s infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            padding: 2px;
            overflow: hidden;
        }

        .db-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes ledPulseBlueRed {
            0% {
                box-shadow: 0 0 15px #3b82f6, inset 0 0 10px #3b82f6;
                border: 2px solid #2563eb;
            }
            50% {
                box-shadow: 0 0 25px #ef4444, 0 0 10px #3b82f6, inset 0 0 15px #ef4444;
                border: 2px solid #ef4444;
                transform: scale(1.02);
            }
            100% {
                box-shadow: 0 0 35px #dc2626, 0 0 20px #1d4ed8, inset 0 0 20px #dc2626;
                border: 2px solid #2563eb;
            }
        }

        .account-badge {
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .account-badge span {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .account-badge input {
            background: transparent;
            border: none;
            color: #60a5fa;
            font-size: 15px;
            font-weight: 700;
            width: 75px;
            outline: none;
            text-align: center;
            font-family: 'Poppins', sans-serif;
        }

        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .warning-title {
            color: #fca5a5;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        .warning-text {
            color: #fecaca;
            font-size: 13px;
            line-height: 1.6;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .accept-btn {
            width: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: all 0.2s ease;
        }
        .accept-btn:disabled {
            background: #475569;
            border-color: #64748b;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .loading, .error-msg {
            padding: 20px;
            color: #94a3b8;
            font-size: 14px;
        }
        .error-msg {
            color: #f87171;
        }
        
        .field-group {
            margin-bottom: 12px;
            text-align: start;
        }
        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }

        .input-with-copy {
            display: flex;
            align-items: center;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid #1e40af;
            box-shadow: 0 0 8px rgba(30, 64, 175, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .field-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 12px;
            font-size: 13px;
            color: #e2e8f0;
            outline: none;
            width: 100%;
            font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif;
            text-align: start;
        }
        .copy-btn {
            background: rgba(30, 41, 59, 0.8);
            border: none;
            padding: 0 14px;
            cursor: pointer;
            color: #60a5fa;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            min-height: 40px;
        }
        html[dir="rtl"] .copy-btn {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        html[dir="ltr"] .copy-btn {
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .copy-btn:hover {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 0 10px #2563eb;
        }
        
        .action-fetch-box {
            margin: 16px 0;
            background: rgba(3, 7, 18, 0.95);
            border: 1.5px solid #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.25);
            border-radius: 14px;
            padding: 14px;
            text-align: start;
        }
        .action-fetch-box .field-label {
            color: #60a5fa;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .fetch-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1d4ed8 0%, #dc2626 100%);
            color: #ffffff;
            border: 1px solid #60a5fa;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .code-display-box {
            background: #020617;
            border: 1.5px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3), inset 0 0 6px rgba(56, 189, 248, 0.15);
            border-radius: 10px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .code-input-field {
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            width: 100%;
            outline: none;
            letter-spacing: 3px;
            font-family: 'Poppins', sans-serif;
        }
        .timer-text {
            font-size: 11px;
            color: #ef4444;
            text-align: center;
            margin-top: 6px;
            font-weight: 700;
            min-height: 16px;
        }

        .show-modal-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1.5px solid #3b82f6;
            color: #38bdf8;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .show-modal-btn:hover {
            background: #1e3a8a;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(15, 23, 42, 0.98);
            border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            text-align: start;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        .modal-title {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 800;
        }
        .close-modal-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- بەشی وێنەی لۆگۆ -->
        <div class="logo-container">
            <div class="db-logo">
                <img src="https://i.ibb.co/3s6qS4L/Mamosta-Hemn-IT.jpg" alt="MamostaHemnIT Logo" onerror="this.onerror=null; this.src='photo_2026-09-13_21-16-20.jpg';">
            </div>
            
            <div class="account-badge">
                <span id="lblAccount">ئەکاونت:</span>
                <input type="text" id="accSmallInput" value="" readonly>

        <!-- باکسی ئاگاداری -->
        <div id="warningBox" class="warning-box">
            <div class="warning-title" id="lblWarningTitle">
                ⚠️ ئاگادارییەکی گرنگ

        <div id="content" style="display: none;">
            <div class="loading" id="lblLoading">چاوەڕوان بە، زانیارییەکان دەهێنرێن...</div>
        </div>
    </div>

    <!-- مۆداڵی زانیارییە شاراوەکان -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="lblModalTitle">🔐 زانیارییە شاراوەکان</div>

            document.getElementById('accSmallInput').value = accountNumber;
            const phone = "9647503728148";
            const message = encodeURIComponent(`سڵاو، من ئەکاونتی ژمارە ${accountNumber}م هەیە.`);
            document.getElementById('whatsappLink').href = `https://wa.me/${phone}?text=${message}`;

            fetch(`${scriptURL}?account=${accountNumber}`)
                .then(response => response.json())
                .then(res => { fetchedData = res; })
                .catch(err => { fetchedData = { status: 'error', message: 'Error fetching data.' }; });
        }

        function setLanguage(lang, e) {
            currentLang = lang;
            const t = translations[lang];

            document.documentElement.setAttribute('dir', t.dir);
            document.documentElement.setAttribute('lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(e && e.target) e.target.classList.add('active');

            document.getElementById('lblAccount').innerText = t.account;
            document.getElementById('lblWarningTitle').innerHTML = t.warningTitle;
            document.getElementById('lblWarningText').innerHTML = t.warningText;
            document.getElementById('lblLoading').innerText = t.loading;
            document.getElementById('lblModalTitle').innerText = t.modalTitle;
            document.getElementById('lblBday').innerText = t.bdayLbl;
            document.getElementById('lblPhone').innerText = t.phoneLbl;
            document.getElementById('toast').innerText = t.toast;

            document.querySelectorAll('.btn-copy-text').forEach(btn => btn.innerText = t.copyBtn);

            if (document.getElementById('acceptBtn').disabled) {
                document.getElementById('acceptBtn').innerText = t.waitBtn.replace('{s}', waitTime);
            } else {
                document.getElementById('acceptBtn').innerText = t.acceptBtn;
            }

            if (fetchedData && document.getElementById('content').style.display !== 'none') {
                renderData(fetchedData);
            }
        }

        waitTimer = setInterval(() => {
            waitTime--;
            const t = translations[currentLang];
            const acceptBtn = document.getElementById('acceptBtn');
            if (waitTime > 0) {
                acceptBtn.innerText = t.waitBtn.replace('{s}', waitTime);
            } else {
                clearInterval(waitTimer);
                acceptBtn.innerText = t.acceptBtn;
                acceptBtn.disabled = false;
            }
        }, 1000);

        function acceptAgreement() {
            document.getElementById('warningBox').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            if (!accountNumber) {
                document.getElementById('content').innerHTML = `<div class="error-msg">${translations[currentLang].noAccountErr}</div>`;
                return;
            }

            if (fetchedData) {
                renderData(fetchedData);
            } else {
                const checkInterval = setInterval(() => {
                    if (fetchedData) {
                        clearInterval(checkInterval);
                        renderData(fetchedData);
                    }
                }, 200);
            }
        }

        function renderData(res) {
            const t = translations[currentLang];
            if (res.status === 'success') {
                let d = res.data;
                
                document.getElementById('bdayInput').value = d.birthday || '';
                document.getElementById('phoneInput').value = d.phone || '';

                document.getElementById('content').innerHTML = `
                    <div class="field-group">
                        <label class="field-label">${t.emailLbl}</label>
                        <div class="input-with-copy">
                            <input type="text" id="emailInput" class="field-input" value="${d.email || ''}" readonly>
                            <button class="copy-btn btn-copy-text" onclick="copyText('emailInput')">${t.copyBtn}</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">${t.passLbl}</label>
                        <div class="input-with-copy">
                            <input type="text" id="passInput" class="field-input" value="${d.password || ''}" readonly>
                            <button class="copy-btn btn-copy-text" onclick="copyText('passInput')">${t.copyBtn}</button>
                        </div>
                    </div>

                    <div class="action-fetch-box">
                        <label class="field-label">${t.codeSectionLbl}</label>
                        
                        <div class="code-display-box">
                            <input type="text" id="fetchedResultInput" class="code-input-field" value="" placeholder="------" readonly>
                            <button class="copy-btn btn-copy-text" style="border-radius: 6px; min-height: 28px; padding: 0 10px; font-size: 11px;" onclick="copyText('fetchedResultInput')">${t.copyBtn}</button>
                        </div>
                        <div id="timerNotice" class="timer-text"></div>

                        <button class="fetch-btn" onclick="fetchTargetLink('${d.link || ''}')">${t.fetchCodeBtn}</button>
                    </div>

                    <button class="show-modal-btn" onclick="toggleModal(true)">
                        <span>${t.showModalBtn}</span>
                    </button>
                `;
            } else {
                document.getElementById('content').innerHTML = `<div class="error-msg">${res.message}</div>`;
            }
        }

        function toggleModal(show) {
            const modal = document.getElementById('infoModal');
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Error");
            }
        }

        function fetchTargetLink(linkUrl) {
            const t = translations[currentLang];
            const resultInput = document.getElementById('fetchedResultInput');
            const timerNotice = document.getElementById('timerNotice');
            
            clearInterval(countdownTimer);
            timerNotice.innerText = "";
            playBeepSound();

            if (!linkUrl || linkUrl === '#') {
                resultInput.value = t.noLink;
                return;
            }

            resultInput.value = '...';

            fetch(linkUrl)
                .then(response => response.text())
                .then(data => {
                    const numbersOnly = data.replace(/[^0-9]/g, '');
                    
                    if (numbersOnly) {
                        resultInput.value = numbersOnly;
                        playBeepSound();

                        let timeLeft = 25;
                        timerNotice.innerText = t.timerText.replace('{s}', timeLeft);

                        countdownTimer = setInterval(() => {
                            timeLeft--;
                            if (timeLeft > 0) {
                                timerNotice.innerText = t.timerText.replace('{s}', timeLeft);
                            } else {
                                clearInterval(countdownTimer);
                                resultInput.value = "";
                                timerNotice.innerText = t.timerExpired;
                            }
                        }, 1000);

                    } else {
                        resultInput.value = t.notFound;
                    }
                })
                .catch(error => {
                    resultInput.value = t.error;
                });
        }

        function copyText(elementId) {
            const inputElement = document.getElementById(elementId);
            if(!inputElement || !inputElement.value) return;

            inputElement.select();
            inputElement.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputElement.value);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
