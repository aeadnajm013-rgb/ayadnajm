<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABO PHONE - Bulk Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; }
        body { background: #030712; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .card { background: #0f0f12; border: 2px solid #eab308; width: 100%; max-width: 550px; border-radius: 20px; padding: 25px; box-shadow: 0 0 20px rgba(234, 179, 8, 0.2); }
        .title { text-align: center; color: #eab308; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; background: #030712; border: 1px solid #ca8a04; color: #fde047; border-radius: 8px; outline: none; }
        textarea { height: 120px; resize: vertical; font-size: 13px; line-height: 1.5; }
        .sheet-box { background: rgba(234, 179, 8, 0.1); border: 1px dashed #eab308; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .hint { font-size: 11px; color: #a1a1aa; margin-top: 4px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-save { background: #10b981; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-save:hover { background: #059669; }
        .btn-delete:hover { background: #dc2626; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">بەڕێوەبردنی بە کۆمەڵی ئەکاونتەکان</div>
    
    <!-- لینکی شیت -->
    <div class="field sheet-box">
        <label style="color: #fde047; font-weight: bold;">🔗 لینکی گۆگڵ شیتەکە (Google Sheet URL)</label>
        <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/...">
    </div>

    <!-- بەشی سڕینەوەی بە کۆمەڵ -->
    <div class="field">
        <label>🗑️ سڕینەوەی بە کۆمەڵ (تەنها ژمارەی ئەکاونتەکان بنووسە):</label>
        <input type="text" id="deleteAccsInput" placeholder="نموونە: 1 3 55 66 343 6566">
        <div class="hint">* تەنها خانەکانی (A تا E) پاکدەبنەوە، ژمارەی ئەکاونتەکە (F) وەک خۆی دەمێنێتەوە.</div>
    </div>

    <hr style="border: 0.5px solid #27272a; margin: 20px 0;">

    <!-- بەشی زیادرکردن / نوێکردنەوەی بە کۆمەڵ -->
    <div class="field">
        <label>➕ زیادرکردن / نوێکردنەوەی بە کۆمەڵ (هەر ئەکاونتێک لە دێڕێک):</label>
        <textarea id="bulkDataInput" placeholder="شێوازی نووسین (بە هێڵی | جیاکراوەتەوە):
ژمارەی_ئەکاونت | ئیمەیل | پاسوۆرد | ژمارەی_مۆبایل | بەروار | لینک

نموونە:
1 | user1@gmail.com | pass123 | 07501234567 | 2000-01-01 | link1
2 | user2@gmail.com | pass456 | 07507654321 | 1998-05-12 | link2"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-save" onclick="manageData('save')">تۆمارکردن / نوێکردنەوەی بە کۆمەڵ</button>
        <button class="btn-delete" onclick="manageData('delete')">پاککردنەوەی بە کۆمەڵ</button>
    </div>

    <div id="statusMsg" class="status"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz2EzHO7pya_o5AHxSyTVOWa5Vud6iIM4tvatbJvV9j3iB6R4_CFEg0BusRZAH0eWXhxg/exec';

    function manageData(actionType) {
        const sheetUrl = document.getElementById('sheetUrlInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (!sheetUrl) {
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = 'تکایە لینکی شیتەکە دابنێ!';
            return;
        }

        let payload = {
            action: actionType,
            sheetUrl: sheetUrl
        };

        // ۱. ئامادەکردنی داواکاری سڕینەوە
        if (actionType === 'delete') {
            const rawDeleteAccs = document.getElementById('deleteAccsInput').value.trim();
            if (!rawDeleteAccs) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = 'تکایە ژمارەی ئەکاونتەکان بنووسە بۆ سڕینەوە!';
                return;
            }
            const accList = rawDeleteAccs.split(/[\s,]+/).filter(item => item.length > 0);
            
            if (!confirm(`دڵنیایت لە پاککردنەوەی زانیارییەکانی [${accList.length}] ئەکاونت؟ (ژمارەی ئەکاونت نەستڕایەوە)`)) return;

            payload.accounts = accList;
        }

        // ۲. ئامادەکردنی داواکاری تۆمارکردن / نوێکردنەوە
        if (actionType === 'save') {
            const rawData = document.getElementById('bulkDataInput').value.trim();
            if (!rawData) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = 'تکایە زانیاری ئەکاونتەکان لە بەشی زیادرکردندا بنووسە!';
                return;
            }

            const lines = rawData.split('\n');
            const items = [];

            lines.forEach(line => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 1 && parts[0] !== "") {
                    items.push({
                        account: parts[0] || '',
                        email: parts[1] || '',
                        password: parts[2] || '',
                        phone: parts[3] || '',
                        birthday: parts[4] || '',
                        link: parts[5] || ''
                    });
                }
            });

            if (items.length === 0) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = 'شێوازی زانیارییەکان ڕاست نیست!';
                return;
            }

            payload.items = items;
        }

        statusMsg.style.color = '#eab308';
        statusMsg.innerText = 'چاوەڕوان بە... داواکاری دەنێردرێت';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusMsg.style.color = '#10b981';
            if (actionType === 'save') {
                statusMsg.innerText = 'زانیاری ئەکاونتەکان بە سەرکەوتوویی نوێکرانەوە/جێگیرکران!';
                document.getElementById('bulkDataInput').value = '';
            } else {
                statusMsg.innerText = 'داواکاری پاککردنەوە بە سەرکەوتوویی ئەنجام درا!';
                document.getElementById('deleteAccsInput').value = '';
            }
        })
        .catch(err => {
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = 'کێشەیەک ڕوویدا لە پەیوەندیکردن!';
        });
    }
</script>

</body>
</html>
