<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MamostaHemnIT Logo Exact Vector</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .logo-box {
            width: 380px;
            height: 380px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* فۆنتەکانی ناو SVG */
        .text-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: -0.5px;
        }
        .text-num {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 52px;
        }
        .text-sal {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-weight: 800;
            font-size: 30px;
            fill: #ffffff;
        }
        .text-exp {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-weight: 700;
            font-size: 15px;
            fill: #ffffff;
        }
        .text-it-sub {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 13px;
            fill: #00a8ff;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="logo-box">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- گرادیێنتی شین بۆ سور (دەوری لۆگۆکە) -->
                <linearGradient id="circleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00c6ff" />
                    <stop offset="45%" stop-color="#0072ff" />
                    <stop offset="70%" stop-color="#9d1bb2" />
                    <stop offset="100%" stop-color="#ff2a5f" />
                </linearGradient>

                <!-- گرادیێنتی بەشی ڕاستی H و IT -->
                <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00d2ff" />
                    <stop offset="100%" stop-color="#0066fe" />
                </linearGradient>

                <!-- گرادیێنتی دەقی MamostaHemnIT -->
                <linearGradient id="textBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="68%" stop-color="#ffffff" />
                    <stop offset="70%" stop-color="#ff2a5f" />
                    <stop offset="100%" stop-color="#ff2a5f" />
                </linearGradient>

                <!-- گرادیێنتی ژمارە 16 (شین بەرەو سوور/پەمەیی) -->
                <linearGradient id="num16Grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00c6ff" />
                    <stop offset="50%" stop-color="#3a7bd5" />
                    <stop offset="100%" stop-color="#ff2a85" />
                </linearGradient>

                <!-- فلتەری تەم و ڕووناکی شین (Glow Effect) -->
                <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- پاشبنەمای ڕەشی بازنەیی لەگەڵ هێڵی دەوری -->
            <circle cx="200" cy="200" r="190" fill="#04060a" stroke="url(#circleBorder)" stroke-width="5" />

            <!-- 1. هێڵەکانی circuit board (لای چەپ) -->
            <g stroke="#00a8ff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
                <!-- هێڵی سەرەوە -->
                <path d="M 95 130 L 130 130 L 150 148" />
                <circle cx="95" cy="130" r="4" fill="#04060a" stroke="#00a8ff" stroke-width="2"/>

                <!-- هێڵی دووەم -->
                <path d="M 80 155 L 120 155 L 140 170" />
                <circle cx="80" cy="155" r="4" fill="#04060a" stroke="#00a8ff" stroke-width="2"/>

                <!-- هێڵی ناوەڕاست (مەستقیم) -->
                <path d="M 70 185 L 140 185" />
                <circle cx="70" cy="185" r="4" fill="#04060a" stroke="#00a8ff" stroke-width="2"/>

                <!-- هێڵی چوارەم -->
                <path d="M 90 215 L 125 215 L 142 200" stroke-dasharray="none" />
                <circle cx="90" cy="215" r="4" fill="#04060a" stroke="#00a8ff" stroke-width="2"/>

                <!-- هێڵی پێنجەم -->
                <path d="M 110 240 L 135 240 L 148 220" />
                <circle cx="110" cy="240" r="4" fill="#04060a" stroke="#00a8ff" stroke-width="2"/>
            </g>

            <!-- 2. پیتی H ی گەورە -->
            <g transform="translate(10, 5)">
                <!-- بەشی سپیی لای چەپی H -->
                <path d="M 148 105 L 178 105 L 178 160 L 210 138 L 210 105 L 240 105 L 240 160 L 178 205 L 148 205 Z" fill="#ffffff"/>

                <!-- بەشی شینی لای ڕاستی H بە بڕینی تیژ -->
                <path d="M 210 138 L 240 118 L 240 212 L 210 212 Z" fill="url(#blueGlow)"/>

                <!-- پیتی IT کە نووسراوە لە تەنیشت H -->
                <path d="M 252 185 L 264 185 L 264 212 L 252 212 Z M 268 185 L 298 185 L 298 193 L 286 193 L 286 212 L 279 212 L 279 193 L 268 193 Z" fill="url(#blueGlow)"/>

                <!-- کەوانە (Orbit Arc) تێپەڕبوو بەناو H -->
                <path d="M 125 210 C 160 170, 260 130, 298 155 C 275 168, 195 188, 125 210 Z" fill="url(#blueGlow)" filter="url(#glowBlue)"/>
            </g>

            <!-- 3. دەقی MamostaHemnIT -->
            <text x="200" y="248" text-anchor="middle" class="text-brand" fill="url(#textBrandGrad)">
                Mamosta<tspan fill="#ff2a5f">HemnIT</tspan>
            </text>

            <!-- هێڵی ژێر ناڤ بە دوو خاڵەکەی سەرەوە -->
            <g opacity="0.9">
                <line x1="90" y1="258" x2="168" y2="258" stroke="#00a8ff" stroke-width="2.5" />
                <circle cx="86" cy="258" r="3.5" fill="#00a8ff" />
                <text x="200" y="262" text-anchor="middle" class="text-it-sub">IT</text>
                <line x1="232" y1="258" x2="310" y2="258" stroke="#00a8ff" stroke-width="2.5" />
                <circle cx="314" cy="258" r="3.5" fill="#00a8ff" />
            </g>

            <!-- 4. بەشی 16 ساڵ ئەزموونم بە گەڵاکانەوە -->
            <g transform="translate(0, 10)">
                <!-- گەڵاکانی لای چەپ -->
                <g stroke="#00a8ff" stroke-width="2" fill="#00a8ff">
                    <path d="M 112 285 C 102 295, 102 315, 122 328" fill="none" />
                    <!-- گەڵا تاکەکان -->
                    <path d="M 106 288 C 98 284, 96 292, 105 295 Z" />
                    <path d="M 100 300 C 91 298, 91 306, 100 308 Z" />
                    <path d="M 103 313 C 95 315, 98 323, 106 320 Z" />
                    <path d="M 112 324 C 107 329, 114 333, 118 327 Z" />
                </g>

                <!-- گەڵاکانی لای ڕاست -->
                <g stroke="#00a8ff" stroke-width="2" fill="#00a8ff">
                    <path d="M 288 285 C 298 295, 298 315, 278 328" fill="none" />
                    <!-- گەڵا تاکەکان -->
                    <path d="M 294 288 C 302 284, 304 292, 295 295 Z" />
                    <path d="M 300 300 C 309 298, 309 306, 300 308 Z" />
                    <path d="M 297 313 C 305 315, 302 323, 294 320 Z" />
                    <path d="M 288 324 C 293 329, 286 333, 282 327 Z" />
                </g>

                <!-- ژمارە 16 و "ساڵ" -->
                <text x="170" y="312" text-anchor="middle" class="text-num" fill="url(#num16Grad)">16</text>
                <text x="235" y="307" text-anchor="middle" class="text-sal">ساڵ</text>

                <!-- سندوقی "ئەزموونم" بە شێوەی شەش لا (Hexagon-like Frame) -->
                <g transform="translate(142, 320)">
                    <!-- چوارگۆشەی بە گۆشەی بڕاو -->
                    <polygon points="0,5 10,0 106,0 116,5 116,23 106,28 10,28 0,23" fill="#04060a" stroke="#00a8ff" stroke-width="1.8" />
                    <text x="58" y="19" text-anchor="middle" class="text-exp">ئەزموونم</text>
                </g>
            </g>
        </svg>
    </div>

</body>
</html>
